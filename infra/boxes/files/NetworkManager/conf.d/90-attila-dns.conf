# MANAGED BY infra/boxes/files/NetworkManager/conf.d/90-attila-dns.conf — deployed by deploy.sh.
#
# cbs_go's StaticIPManager rewrites the eth0 connection profile at every boot
# (ipv4.method, ipv4.addresses, ipv4.gateway, ipv4.dns) with the lease it took
# and the resolvers 114.114.114.114 + 8.8.8.8. Editing the profile therefore
# does not stick. Handing resolv.conf back to the administrator does: with
# dns=none NetworkManager stops generating /etc/resolv.conf, and the versioned
# files/resolv.conf rules. The profile's ipv4.dns stays whatever the vendor
# writes — it is inert.
[main]
dns=none

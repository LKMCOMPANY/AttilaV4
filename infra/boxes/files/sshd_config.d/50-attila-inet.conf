# MANAGED BY infra/boxes/files/sshd_config.d/50-attila-inet.conf — deployed by
# deploy.sh on every run (validated with `sshd -t`, then reloaded).
#
# The boxes hold a global IPv6 address on the office uplink, and IPv6 has no
# NAT: the vendor's sshd (root by password until --lock-root-password) listened
# on `[::]:22`, reachable from the internet if the router lets it through
# (measured 25 September 2026). Nothing of ours reaches a box over IPv6 — the
# LAN path is IPv4, the tunnel is cloudflared → 127.0.0.1 — so sshd listens on
# IPv4 only. The IPv6 address itself is left to the vendor.
AddressFamily inet

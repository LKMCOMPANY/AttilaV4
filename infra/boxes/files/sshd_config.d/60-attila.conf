# MANAGED BY infra/boxes/files/sshd_config.d/60-attila.conf — deployed by
# deploy.sh ONLY with --lock-root-password (a gated step: it is applied after a
# key login has been verified on the same run, never blind).
#
# root authenticates with the fleet key (files/authorized_keys) only. The
# vendor's cbs_debug user (50-cbs-debug.conf, the VMOS support tunnel) keeps
# its password: this Match block is scoped to root.
Match User root
	PasswordAuthentication no
	KbdInteractiveAuthentication no

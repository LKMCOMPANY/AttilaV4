# MANAGED BY infra/boxes/files/journald.conf.d/attila.conf — deployed by deploy.sh.
#
# The stock journald.conf ships with SystemMaxUse commented out: on 25 Sep 2026
# every box carried 2.5–2.6 GB of journal on a 26 GB eMMC root, next to an
# rsyslog copy of the same lines. 300 MB keeps roughly a fortnight of a busy
# box; deploy.sh vacuums to this size when it lands.
[Journal]
SystemMaxUse=300M
SystemMaxFileSize=50M
MaxRetentionSec=1month

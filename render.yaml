services:
  # ── Main Web Service ──────────────────────────────────────────────────
  # Pipeline workers (process + execute), the Gorgone sweep, reconcile, reaper,
  # verify, account-health, schedule and maintain workers run as continuous
  # loops inside server.mjs — no external cron needed. Concurrency knobs are
  # wired through env vars below.
  #
  # Re-aligned on the LIVE service on 25 September 2026 (Render MCP,
  # srv-d7g6qtdckfvc73bapk20): name `attila` (slug attila-yew3), build
  # `npm install; npm run build`, start `npm run start`, auto-deploy on every
  # commit to main, one starter instance in Frankfurt. The live service has NO
  # health check path configured; `/api/health` exists and answering it is what
  # a zero-downtime deploy should wait for — enable it in the dashboard (Settings
  # → Health Check Path) and this line stops being aspirational.
  - type: web
    name: attila
    runtime: node
    region: frankfurt
    plan: starter
    branch: main
    buildCommand: npm install; npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_APP_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: CF_ACCESS_CLIENT_ID
        sync: false
      - key: CF_ACCESS_CLIENT_SECRET
        sync: false
      - key: GORGONE_SUPABASE_URL
        sync: false
      - key: GORGONE_SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: GORGONE_WEBHOOK_SECRET
        sync: false
      - key: ALERIA_API_KEY
        sync: false
      - key: ALERIA_BASE_URL
        sync: false
      - key: CRON_SECRET
        sync: false
      # TikHub — powers post verification + avatar account-health (secret).
      - key: TIKHUB_API_KEY
        sync: false
      - key: PIPELINE_PROCESS_CONCURRENCY
        value: "3"
      - key: PIPELINE_EXECUTE_CONCURRENCY
        value: "2"
      - key: PIPELINE_IDLE_MS
        value: "5000"
      - key: GORGONE_SWEEP_INTERVAL_MS
        value: "60000"
